name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.3)'
        required: true
        type: string

jobs:
  build-extension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Set version
      id: version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "push" ]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Extracted version from tag: $VERSION"
        else
          VERSION="${{ github.event.inputs.version }}"
          echo "Using manual version: $VERSION"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Final version: $VERSION"
        
    - name: Update version files
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        # Use Node.js to update JSON files (cross-platform)
        node -e "
          const fs = require('fs');
          const version = '$VERSION';
          
          // Update manifest.json
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.version = version;
          fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          
          // Update package.json
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          
          // Update tauri.conf.json
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          tauri.package.version = version;
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');
          
          console.log('Updated all version files to ' + version);
        "
        
    - name: Create build directory
      run: |
        mkdir -p build
        
    - name: Copy files to build directory
      run: |
        cp manifest.json build/
        cp popup.html build/
        cp -r css build/
        cp -r js build/
        cp -r icons build/
        echo "Files copied to build directory"
        
    - name: Create zip file
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        cd build
        zip -r "../minimal-pomodoro-v${VERSION}.zip" .
        cd ..
        ls -lh minimal-pomodoro-v${VERSION}.zip
        
    - name: Upload extension artifact
      uses: actions/upload-artifact@v4
      with:
        name: chrome-extension-v${{ steps.version.outputs.version }}
        path: minimal-pomodoro-v${{ steps.version.outputs.version }}.zip
        retention-days: 30

  build-desktop:
    name: Build Desktop App
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            artifact-name: 'windows'
            file-pattern: '*.msi'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            artifact-name: 'macos'
            file-pattern: '*.dmg'
          - platform: 'ubuntu-latest'
            target: 'x86_64-unknown-linux-gnu'
            artifact-name: 'linux'
            file-pattern: '*.AppImage'
    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.platform == 'macos-latest' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Set version
      id: version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "push" ]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Extracted version from tag: $VERSION"
        else
          VERSION="${{ github.event.inputs.version }}"
          echo "Using manual version: $VERSION"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Final version: $VERSION"
        
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        
    - name: Install system dependencies (Linux)
      if: matrix.platform == 'ubuntu-latest'
      run: |
        sudo apt-get update
        # Try to install webkit2gtk (package name may vary by Ubuntu version)
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libwebkit2gtk-4.0-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          || sudo apt-get install -y \
          libwebkit2gtk-6.0-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf
        
    - name: Install system dependencies (macOS)
      if: matrix.platform == 'macos-latest'
      run: |
        brew install create-dmg || true
        
    - name: Update version files
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        # Use Node.js to update JSON files (cross-platform)
        node -e "
          const fs = require('fs');
          const version = '$VERSION';
          
          // Update package.json
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          
          // Update tauri.conf.json
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          tauri.package.version = version;
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');
          
          console.log('Updated all version files to ' + version);
        "
        
    - name: Install Python dependencies (Windows)
      if: matrix.platform == 'windows-latest'
      run: |
        pip install Pillow || python -m pip install Pillow
        
    - name: Install Tauri CLI
      run: |
        npm install -g @tauri-apps/cli@latest
        
    - name: Prepare dist directory for icons
      shell: bash
      run: |
        mkdir -p dist/icons
        if [ -d "icons" ]; then
          cp -r icons/* dist/icons/ 2>/dev/null || true
        fi
        # For Windows, generate proper ICO file from PNG
        if [ "${{ matrix.platform }}" == "windows-latest" ]; then
          if [ ! -f "dist/icons/icon.ico" ] && [ -f "icons/icon128.png" ]; then
            # Use Python to convert PNG to ICO (PIL/Pillow)
            python3 -c "
from PIL import Image
import os
png_path = 'icons/icon128.png'
ico_path = 'dist/icons/icon.ico'
if os.path.exists(png_path):
    img = Image.open(png_path)
    if img.mode != 'RGBA':
        img = img.convert('RGBA')
    img.save(ico_path, format='ICO', sizes=[(128, 128), (64, 64), (32, 32), (16, 16)])
    print('ICO file created successfully')
else:
    print('PNG file not found')
" || echo "Failed to generate ICO, will use Tauri default"
          fi
        fi
        
    - name: Build Tauri app
      run: |
        npm install
        npm run tauri build
      continue-on-error: ${{ matrix.platform == 'macos-latest' }}
        
    - name: Upload desktop artifacts
      uses: actions/upload-artifact@v4
      with:
        name: desktop-${{ matrix.artifact-name }}-v${{ steps.version.outputs.version }}
        path: |
          src-tauri/target/release/bundle/**/${{ matrix.file-pattern }}
          src-tauri/target/release/*.exe
        retention-days: 30
        if-no-files-found: warn

  create-release:
    name: Create Release
    needs: [build-extension, build-desktop]
    runs-on: ubuntu-latest
    if: always() && needs.build-extension.result == 'success'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set version
      id: version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "push" ]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Extracted version from tag: $VERSION"
        else
          VERSION="${{ github.event.inputs.version }}"
          echo "Using manual version: $VERSION"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Final version: $VERSION"
        
    - name: Download extension artifact
      uses: actions/download-artifact@v4
      with:
        name: chrome-extension-v${{ steps.version.outputs.version }}
        path: ./artifacts/extension
        
    - name: Download desktop artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: desktop-*-v${{ steps.version.outputs.version }}
        path: ./artifacts/desktop
        merge-multiple: true
        
    - name: List artifacts
      shell: bash
      run: |
        echo "Extension artifacts:"
        if [ -d "./artifacts/extension" ]; then
          find ./artifacts/extension -type f 2>/dev/null || ls -R ./artifacts/extension 2>/dev/null || echo "No extension artifacts found"
        else
          echo "Extension artifacts directory not found"
        fi
        echo ""
        echo "Desktop artifacts:"
        if [ -d "./artifacts/desktop" ]; then
          find ./artifacts/desktop -type f 2>/dev/null || ls -R ./artifacts/desktop 2>/dev/null || echo "No desktop artifacts found"
        else
          echo "Desktop artifacts directory not found"
        fi
        
    - name: Find and list release files
      shell: bash
      id: find-files
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        echo "Finding files for release v$VERSION..."
        
        # Find all files and build a multiline string
        FILE_LIST=""
        
        # Extension files
        if [ -d "./artifacts/extension" ]; then
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              FILE_LIST="${FILE_LIST}${file}"$'\n'
              echo "Found: $file"
            fi
          done < <(find ./artifacts/extension -type f)
        fi
        
        # Desktop files
        if [ -d "./artifacts/desktop" ]; then
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              FILE_LIST="${FILE_LIST}${file}"$'\n'
              echo "Found: $file"
            fi
          done < <(find ./artifacts/desktop -type f)
        fi
        
        # Output file list (remove trailing newline)
        FILE_LIST=$(echo -n "$FILE_LIST" | sed -z '$ s/\n$//')
        
        if [ -n "$FILE_LIST" ]; then
          echo "Files to upload:"
          echo "$FILE_LIST"
          FILE_COUNT=$(echo "$FILE_LIST" | grep -c '^' || echo "0")
          echo "Total files: $FILE_COUNT"
          # Save to output for use in next step
          echo "file_list<<EOF" >> $GITHUB_OUTPUT
          echo "$FILE_LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
        else
          echo "WARNING: No files found!"
          echo "file_list=" >> $GITHUB_OUTPUT
          echo "file_count=0" >> $GITHUB_OUTPUT
        fi
        
    - name: Create release
      uses: softprops/action-gh-release@v1
      continue-on-error: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: |
          ${{ steps.find-files.outputs.file_list }}
        fail_on_unmatched_files: false
        name: Minimal Pomodoro Timer v${{ steps.version.outputs.version }}
        body: |
          ## Minimal Pomodoro Timer v${{ steps.version.outputs.version }}
          
          ### Downloads
          
          #### Chrome Extension
          Download the extension package from the assets below (`.zip` file).
          
          **Installation:**
          1. Download the `.zip` file
          2. Extract it to a folder
          3. Open Chrome and go to `chrome://extensions/`
          4. Enable "Developer mode"
          5. Click "Load unpacked" and select the extracted folder
          
          #### Desktop Application
          Download the desktop application for your platform:
          - **Windows**: `.msi` installer
          - **macOS**: `.dmg` disk image
          - **Linux**: `.AppImage` application
          
          **Installation:**
          - **Windows**: Run the `.msi` installer
          - **macOS**: Open the `.dmg` and drag the app to Applications
          - **Linux**: Make the `.AppImage` executable (`chmod +x`) and run it
          
          ### Changes
          - See commit history for detailed changes
          
          **Note**: For Chrome Web Store installation, please visit the [Chrome Web Store](https://chrome.google.com/webstore) page.
        draft: false
        prerelease: false
