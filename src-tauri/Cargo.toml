[package]
name = "minimal-pomodoro-timer"
version = "1.0.1"
description = "A minimal pomodoro timer desktop application"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[[bin]]
name = "minimal-pomodoro-timer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "window-start-dragging", "window-unminimize", "window-maximize", "window-hide", "window-minimize", "window-close", "window-unmaximize", "window-show", "shell-open", "notification-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

