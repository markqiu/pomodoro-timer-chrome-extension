<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Pomodoro Timer</title>
    <!-- 极简番茄钟 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Minimal Pomodoro Timer</h1>
            <!-- 极简番茄钟 -->
        </header>

        <main>
            <div class="timer-display">
                <div class="timer-circle">
                    <div class="timer-text">
                        <div class="timer-time" id="timerDisplay">25:00</div>
                        <div class="timer-label" id="timerLabel">Ready to Start</div>
                        <!-- 准备开始 -->
                    </div>
                    <svg class="progress-ring" width="300" height="300">
                        <circle class="progress-ring-circle" cx="150" cy="150" r="140"></circle>
                    </svg>
                </div>
            </div>

            <div class="controls">
                <div class="start-controls">
                    <button id="startBtn" class="btn btn-primary">Start</button>
                    <!-- 开始 -->
                    <div class="start-menu" id="startMenu">
                        <button class="menu-item" data-phase="pomodoro">Start Pomodoro</button>
                        <!-- 开始番茄钟 -->
                        <button class="menu-item" data-phase="shortBreak">Start Short Break</button>
                        <!-- 开始小休 -->
                        <button class="menu-item" data-phase="longBreak">Start Long Break</button>
                        <!-- 开始大休 -->
                    </div>
                </div>
                <button id="pauseBtn" class="btn btn-secondary" style="display: none;">Pause</button>
                <!-- 暂停 -->
                <button id="resetBtn" class="btn btn-secondary">Reset</button>
                <!-- 重置 -->
                <button id="settingsBtn" class="btn btn-icon" title="Settings">⚙️</button>
                <!-- 设置 -->
            </div>

            <div class="progress-info">
                <div class="cycle-info">
                    <span>Current Cycle: <span id="currentCycle">0</span>/<span id="totalCycles">4</span></span>
                    <!-- 当前循环: -->
                </div>
            </div>
        </main>

        <!-- Settings Panel -->
        <!-- 设置面板 -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <!-- 设置 -->
                    <button class="close-btn" id="closeSettings">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="setting-item">
                        <label for="pomodoroTime">Pomodoro Duration (minutes)</label>
                        <!-- 番茄钟时长（分钟） -->
                        <input type="number" id="pomodoroTime" min="1" max="60" value="25">
                    </div>
                    <div class="setting-item">
                        <label for="shortBreakTime">Short Break Duration (minutes)</label>
                        <!-- 小休时长（分钟） -->
                        <input type="number" id="shortBreakTime" min="1" max="30" value="5">
                    </div>
                    <div class="setting-item">
                        <label for="longBreakTime">Long Break Duration (minutes)</label>
                        <!-- 大休时长（分钟） -->
                        <input type="number" id="longBreakTime" min="1" max="60" value="15">
                    </div>
                    <div class="setting-item">
                        <label for="cyclesBeforeLongBreak">Cycles Before Long Break</label>
                        <!-- 持续次数（大休前） -->
                        <input type="number" id="cyclesBeforeLongBreak" min="2" max="10" value="4">
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="enableSound"> Enable Sound Alert
                            <!-- 启用声音提醒 -->
                        </label>
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="enableNotification"> Enable Notification Alert
                            <!-- 启用通知提醒 -->
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" id="saveSettings">Save</button>
                    <!-- 保存 -->
                    <button class="btn btn-secondary" id="cancelSettings">Cancel</button>
                    <!-- 取消 -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/pomodoro.js"></script>
</body>
</html>
